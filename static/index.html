<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metadata Inspector</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a22;
    --panel-2: #1d212b;
    --border: #2a2f3d;
    --text: #d7dae2;
    --muted: #8b91a0;
    --accent: #7c8cf8;
    --accent-2: #5ee0c2;
    --warn-bg: #35201f;
    --warn-border: #e0655f;
    --warn-text: #f4b8b4;
    --info-bg: #1c2b3d;
    --info-border: #5c9ded;
    --info-text: #b9d4f2;
    --good: #7fd58a;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(124, 140, 248, 0.12), transparent 60%),
      radial-gradient(900px 400px at 10% 110%, rgba(94, 224, 194, 0.07), transparent 60%),
      var(--bg);
    color: var(--text); min-height: 100vh; padding: 20px clamp(14px, 4vw, 48px) 80px;
  }
  body.dragover { outline: 3px dashed var(--accent); outline-offset: -8px; }
  code, .mono, td, .hash, pre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    display: grid; place-items: center; font-size: 17px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  header h1 {
    font-size: 19px; font-weight: 700; letter-spacing: 0.2px;
    background: linear-gradient(90deg, #fff, #aab4ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header .tagline { color: var(--muted); font-size: 13px; }
  .privacy {
    margin-left: auto; font-size: 12px; color: var(--accent-2);
    border: 1px solid rgba(94, 224, 194, 0.35); border-radius: 999px; padding: 3px 12px;
    background: rgba(94, 224, 194, 0.07); white-space: nowrap;
  }

  /* Hero drop zone, shown until the first file arrives */
  #hero {
    border: 2px dashed var(--border); border-radius: 16px; background: var(--panel);
    padding: 56px 24px; text-align: center; cursor: pointer; margin: 6vh auto 0;
    max-width: 720px; transition: border-color 0.15s, background 0.15s;
  }
  #hero:hover, body.dragover #hero { border-color: var(--accent); background: var(--panel-2); }
  #hero svg { width: 56px; height: 56px; margin-bottom: 14px; stroke: var(--accent); }
  #hero .big { font-size: 20px; font-weight: 650; color: #fff; margin-bottom: 6px; }
  #hero .sub { color: var(--muted); margin-bottom: 20px; }
  #hero .formats { color: var(--muted); font-size: 12px; margin-top: 22px; }

  button, .btn {
    font: inherit; font-size: 13px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); padding: 5px 14px; cursor: pointer; border-radius: 7px;
  }
  button:hover { border-color: var(--accent); color: #fff; }
  button.primary {
    background: linear-gradient(135deg, var(--accent), #6a79e8); border: none;
    color: #fff; font-weight: 600; padding: 8px 22px;
  }
  button.primary:hover { filter: brightness(1.1); }
  input[type="search"] {
    font: inherit; font-size: 13px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); padding: 5px 12px; border-radius: 7px; width: 280px;
  }
  input[type="search"]:focus { outline: none; border-color: var(--accent); }

  .card {
    border: 1px solid var(--border); border-radius: 12px; margin-bottom: 18px;
    background: var(--panel); overflow: hidden; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
  }
  .card > .head {
    display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel-2);
  }
  .head .fname { font-weight: 650; font-size: 15px; color: #fff; word-break: break-all; }
  .badge {
    font-size: 11.5px; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px;
  }
  .hash { font-size: 12px; color: #8fb7ef; cursor: pointer; word-break: break-all; }
  .hash:hover { text-decoration: underline; }
  .copied { color: var(--good); }
  .body { padding: 12px 16px 16px; }

  .flags { margin: 2px 0 12px; display: grid; gap: 6px; }
  .flag { padding: 8px 12px; border-left: 4px solid; border-radius: 6px; font-size: 13px; }
  .flag.warning { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-text); }
  .flag.info { background: var(--info-bg); border-color: var(--info-border); color: var(--info-text); }
  .flag .fields { color: var(--muted); display: block; font-size: 12px; margin-top: 2px; }
  .gpslink { color: var(--good); }
  .errors { color: #e0a95f; margin: 6px 0; font-size: 13px; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 12px; }
  details.group { border: 1px solid var(--border); border-radius: 8px; margin: 7px 0; overflow: hidden; }
  details.group > summary {
    cursor: pointer; padding: 6px 12px; background: var(--panel-2); color: #cfd4e0;
    font-weight: 600; font-size: 13px; user-select: none; list-style: none;
  }
  details.group > summary::before { content: "\25BE\2009"; color: var(--accent); }
  details.group:not([open]) > summary::before { content: "\25B8\2009"; }
  details.group > summary .count { color: var(--muted); font-weight: 400; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  td { padding: 4px 12px; border-top: 1px solid #21252f; vertical-align: top; }
  tr:nth-child(even) td { background: rgba(255, 255, 255, 0.015); }
  td.k { width: 30%; color: #9fc6f5; white-space: nowrap; }
  td.v { word-break: break-word; white-space: pre-wrap; }

  pre.raw {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px;
    overflow: auto; margin: 6px 0; max-height: 500px; font-size: 12px;
  }
  .spinner {
    display: inline-block; width: 15px; height: 15px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: -2px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <div class="logo">&#128269;</div>
  <h1>Metadata Inspector</h1>
  <span class="tagline">see everything a file says about itself</span>
  <span class="privacy">100% local &#183; files never leave this machine</span>
</header>

<div id="hero">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v12m0-12l-4 4m4-4l4 4"/>
    <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
  </svg>
  <div class="big">Drop files here</div>
  <div class="sub">or click anywhere in this box to browse</div>
  <button class="primary" type="button">Choose files</button>
  <div class="formats">images &#183; PDF &#183; Office documents &#183; video &#183; audio &#183; archives &#183; anything else</div>
</div>

<input type="file" id="picker" multiple class="hidden">
<div id="results"></div>

<script>
"use strict";

const resultsEl = document.getElementById("results");
const heroEl = document.getElementById("hero");
const picker = document.getElementById("picker");
heroEl.onclick = () => picker.click();
picker.onchange = () => { enqueue([...picker.files]); picker.value = ""; };

// Full-window drop target. dragenter/leave fire on children constantly, so a
// counter is the reliable way to keep the highlight stable.
let dragDepth = 0;
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("dragenter", e => {
  e.preventDefault();
  if (++dragDepth === 1) document.body.classList.add("dragover");
});
document.addEventListener("dragleave", () => {
  if (--dragDepth === 0) document.body.classList.remove("dragover");
});
document.addEventListener("drop", e => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove("dragover");
  enqueue([...e.dataTransfer.files]);
});

// Sequential processing per spec: one in-flight request keeps big files from
// competing for disk and CPU.
const queue = [];
let busy = false;
function enqueue(files) {
  if (files.length) heroEl.classList.add("hidden");
  for (const f of files) queue.push(f);
  pump();
}
async function pump() {
  if (busy) return;
  busy = true;
  while (queue.length) {
    const file = queue.shift();
    const card = makePendingCard(file);
    try {
      const form = new FormData();
      form.append("file", file);
      const resp = await fetch("/api/inspect", { method: "POST", body: form });
      if (!resp.ok) {
        let detail = resp.statusText;
        try { detail = (await resp.json()).detail || detail; } catch {}
        renderError(card, file, `${resp.status}: ${detail}`);
        continue;
      }
      renderResult(card, await resp.json());
    } catch (err) {
      renderError(card, file, String(err));
    }
  }
  busy = false;
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function makePendingCard(file) {
  const card = el("div", "card");
  const head = el("div", "head");
  head.appendChild(el("span", "spinner"));
  head.appendChild(el("span", "fname", file.name));
  head.appendChild(el("span", "badge", "inspecting..."));
  card.appendChild(head);
  // Newest first so the file just dropped is visible without scrolling.
  resultsEl.prepend(card);
  return card;
}

function renderError(card, file, message) {
  card.textContent = "";
  const head = el("div", "head");
  head.appendChild(el("span", "fname", file.name));
  card.appendChild(head);
  const body = el("div", "body");
  body.appendChild(el("div", "flag warning", message));
  card.appendChild(body);
}

function humanSize(n) {
  if (n < 1024) return n + " B";
  const units = ["KB", "MB", "GB", "TB"];
  let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < units.length - 1);
  return n.toFixed(n >= 100 ? 0 : 1) + " " + units[i];
}

function copyable(label, value) {
  const span = el("span", "hash", `${label}:${value}`);
  span.title = "click to copy";
  span.onclick = async () => {
    try { await navigator.clipboard.writeText(value); }
    catch {
      // Clipboard API needs a secure context; execCommand still works on
      // plain http://localhost in some browsers, so try it as a fallback.
      const ta = document.createElement("textarea");
      ta.value = value; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove();
    }
    span.classList.add("copied");
    setTimeout(() => span.classList.remove("copied"), 800);
  };
  return span;
}

function renderResult(card, data) {
  card.textContent = "";
  const info = data.file_info;

  const head = el("div", "head");
  head.appendChild(el("span", "fname", info.name));
  head.appendChild(el("span", "badge", info.detected_type || "unknown type"));
  head.appendChild(el("span", "badge", `${humanSize(info.size)} (${info.size} B)`));
  head.appendChild(copyable("md5", info.md5));
  head.appendChild(copyable("sha256", info.sha256));
  card.appendChild(head);

  const body = el("div", "body");
  card.appendChild(body);

  // Flags first, warnings already sorted ahead of info by the backend.
  if (data.flags.length || data.gps) {
    const flagsEl = el("div", "flags");
    for (const flag of data.flags) {
      const f = el("div", `flag ${flag.severity}`);
      f.appendChild(el("span", null, `${flag.severity.toUpperCase()}: ${flag.label}`));
      if (flag.fields.length) f.appendChild(el("span", "fields", flag.fields.join(", ")));
      if (data.gps && flag.label.startsWith("GPS")) {
        const [lat, lon] = data.gps;
        const a = el("a", "gpslink", `${lat.toFixed(6)}, ${lon.toFixed(6)} (OpenStreetMap)`);
        a.href = `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=15/${lat}/${lon}`;
        a.target = "_blank";
        a.rel = "noopener";
        f.appendChild(document.createElement("br"));
        f.appendChild(a);
      }
      flagsEl.appendChild(f);
    }
    body.appendChild(flagsEl);
  }

  if (data.errors.length) {
    const errs = el("div", "errors");
    errs.textContent = "extraction errors: " + data.errors.join(" | ");
    body.appendChild(errs);
  }

  const toolbar = el("div", "toolbar");
  const search = document.createElement("input");
  search.type = "search";
  search.placeholder = "filter keys and values...";
  toolbar.appendChild(search);
  const btnJson = el("button", null, "Export JSON");
  const btnCsv = el("button", null, "Export CSV");
  const btnRaw = el("button", null, "Raw");
  toolbar.appendChild(btnJson);
  toolbar.appendChild(btnCsv);
  toolbar.appendChild(btnRaw);
  body.appendChild(toolbar);

  const rawPre = el("pre", "raw hidden");
  rawPre.textContent = JSON.stringify(data.raw, null, 2);
  body.appendChild(rawPre);
  btnRaw.onclick = () => rawPre.classList.toggle("hidden");

  const groupsEl = el("div");
  body.appendChild(groupsEl);
  for (const group of data.groups) {
    const details = el("details", "group");
    details.open = true;
    const summary = el("summary");
    summary.appendChild(el("span", null, group.name + " "));
    summary.appendChild(el("span", "count", `(${group.entries.length})`));
    details.appendChild(summary);
    const table = document.createElement("table");
    for (const entry of group.entries) {
      const tr = document.createElement("tr");
      const value = typeof entry.value === "string" ? entry.value : JSON.stringify(entry.value);
      tr.appendChild(el("td", "k", entry.key));
      tr.appendChild(el("td", "v", value));
      tr.dataset.search = (group.name + " " + entry.key + " " + value).toLowerCase();
      table.appendChild(tr);
    }
    details.appendChild(table);
    groupsEl.appendChild(details);
  }

  search.oninput = () => {
    const needle = search.value.toLowerCase();
    for (const details of groupsEl.children) {
      let visible = 0;
      for (const tr of details.querySelectorAll("tr")) {
        const hit = !needle || tr.dataset.search.includes(needle);
        tr.classList.toggle("hidden", !hit);
        if (hit) visible++;
      }
      details.classList.toggle("hidden", visible === 0);
    }
  };

  const baseName = info.name.replace(/\.[^.]*$/, "") || "metadata";
  btnJson.onclick = () =>
    download(`${baseName}.metadata.json`, JSON.stringify(data, null, 2), "application/json");
  btnCsv.onclick = () =>
    download(`${baseName}.metadata.csv`, toCsv(data.groups), "text/csv");
}

// Mirrors logic.flatten_csv_rows / rows_to_csv on the backend: group,key,value
// rows with non-strings JSON-encoded. Kept client side so exporting needs no
// second request.
function toCsv(groups) {
  const esc = s => /[",\n\r]/.test(s) ? '"' + s.replaceAll('"', '""') + '"' : s;
  const lines = ["group,key,value"];
  for (const group of groups) {
    for (const entry of group.entries) {
      const value = typeof entry.value === "string" ? entry.value : JSON.stringify(entry.value);
      lines.push([group.name, entry.key, value].map(esc).join(","));
    }
  }
  return lines.join("\r\n") + "\r\n";
}

function download(name, content, mime) {
  const url = URL.createObjectURL(new Blob([content], { type: mime }));
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
